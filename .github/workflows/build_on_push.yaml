name: Deploy Images to GHCR when pushing to main branch

on:
  push:
    branches:
      - main

# Both publishing workflows push the same floating per-arch tags
# (:amd64, :arm64v8, :arm32v7), which create-manifests later assembles into
# :latest. Overlapping runs would interleave those pushes, so serialise them
# across BOTH workflows via a shared group. Never cancel in progress: killing a
# run mid-publish is what leaves the tags skewed in the first place.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

# Least privilege by default; jobs opt up to what they actually need.
permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current_version: ${{ steps.get_version.outputs.current_version }}

    steps:
      - name: Get current version
        id: get_version
        run: |
          CURRENT_VERSION_JSON=`curl -s https://releases.caldera.homes/music/headless/latest/latest.json`
          CURRENT_VERSION=`echo $CURRENT_VERSION_JSON | jq -r .version`
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

  build-amd64:
    needs: get-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GIT_HUB_TOKEN}}

      - name: Build AMD64 image
        run: |
          docker buildx create --use
          docker buildx build --build-arg CALDERA_VERSION=${{ needs.get-version.outputs.current_version }} --platform linux/amd64 \
            -t ghcr.io/${{github.actor}}/caldera-music:amd64 \
            -t ghcr.io/${{github.actor}}/caldera-music:amd64-${{ needs.get-version.outputs.current_version }} \
            --push .

  build-arm64:
    needs: get-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GIT_HUB_TOKEN}}

      - name: Build ARM64 image
        run: |
          docker buildx create --use
          docker buildx build --build-arg CALDERA_VERSION=${{ needs.get-version.outputs.current_version }} --platform linux/arm64 \
            -t ghcr.io/${{github.actor}}/caldera-music:arm64v8 \
            -t ghcr.io/${{github.actor}}/caldera-music:arm64v8-${{ needs.get-version.outputs.current_version }} \
            --push .

  build-arm32:
    needs: get-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GIT_HUB_TOKEN}}

      - name: Build ARM32v7 image
        run: |
          docker buildx create --use
          docker buildx build --build-arg CALDERA_VERSION=${{ needs.get-version.outputs.current_version }} --platform linux/arm/v7 \
            -t ghcr.io/${{github.actor}}/caldera-music:arm32v7 \
            -t ghcr.io/${{github.actor}}/caldera-music:arm32v7-${{ needs.get-version.outputs.current_version }} \
            --push .

  create-manifests:
    needs: [get-version, build-amd64, build-arm64, build-arm32]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GIT_HUB_TOKEN}}

      - name: Create multi-arch manifests
        run: |
          docker buildx imagetools create -t ghcr.io/${{github.actor}}/caldera-music:latest \
            ghcr.io/${{github.actor}}/caldera-music:amd64 \
            ghcr.io/${{github.actor}}/caldera-music:arm64v8 \
            ghcr.io/${{github.actor}}/caldera-music:arm32v7
          docker buildx imagetools create -t ghcr.io/${{github.actor}}/caldera-music:${{ needs.get-version.outputs.current_version }} \
            ghcr.io/${{github.actor}}/caldera-music:amd64-${{ needs.get-version.outputs.current_version }} \
            ghcr.io/${{github.actor}}/caldera-music:arm64v8-${{ needs.get-version.outputs.current_version }} \
            ghcr.io/${{github.actor}}/caldera-music:arm32v7-${{ needs.get-version.outputs.current_version }}