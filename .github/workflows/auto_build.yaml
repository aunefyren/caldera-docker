name: Deploy Images to GHCR when a new version is detected

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Both publishing workflows push the same floating per-arch tags
# (:amd64, :arm64v8, :arm32v7), which create-manifests later assembles into
# :latest. Overlapping runs would interleave those pushes, so serialise them
# across BOTH workflows via a shared group. Never cancel in progress: killing a
# run mid-publish is what leaves the tags skewed in the first place.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

# Least privilege by default; jobs opt up to what they actually need.
permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trigger_workflow: ${{ steps.compare_versions.outputs.trigger_workflow }}
      current_version: ${{ steps.compare_versions.outputs.current_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare versions
        id: compare_versions
        run: |
          # pipefail so an upstream blip fails here loudly instead of yielding a
          # "null" version that only blows up three build jobs later.
          set -o pipefail

          BASE=https://releases.caldera.homes/music/headless/latest

          PREVIOUS_VERSION_JSON=`cat version.json`
          CURRENT_VERSION_JSON=`curl -sSf $BASE/latest.json`
          CURRENT_VERSION=`echo $CURRENT_VERSION_JSON | jq -r .version`

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ "$PREVIOUS_VERSION_JSON" = "$CURRENT_VERSION_JSON" ]; then
            echo "already on $CURRENT_VERSION; nothing to do"
            echo "trigger_workflow=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Upstream serves every arch out of the same rolling latest/ prefix, and
          # the per-arch tarballs do not always flip in lockstep with latest.json
          # (run 34775203667: latest.json said 1.1.0 while aarch64 still served
          # 1.0.47). Building on a skewed prefix burns three jobs, trips the
          # Dockerfile version guard, and strands the floating per-arch tags on two
          # different releases until the next good run. Confirm all three arches
          # actually serve $CURRENT_VERSION first; if not, hold and let the next
          # hourly poll pick it up once upstream has settled.
          for arch in x86_64 aarch64 armv7; do
            if ! ACTUAL=`curl -sSfL "$BASE/caldera-music-linux-$arch.tar.gz" | tar xzO ./VERSION`; then
              echo "::warning::could not read VERSION for $arch; holding for the next poll"
              echo "trigger_workflow=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ "$ACTUAL" != "$CURRENT_VERSION" ]; then
              echo "::warning::upstream skew: latest.json says $CURRENT_VERSION but $arch serves $ACTUAL; holding for the next poll"
              echo "trigger_workflow=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "$arch serves $ACTUAL"
          done

          echo "all arches agree on $CURRENT_VERSION; triggering build"
          echo "trigger_workflow=true" >> $GITHUB_OUTPUT

  build-amd64:
    needs: check-version
    if: needs.check-version.outputs.trigger_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GIT_HUB_TOKEN}}

      - name: Build AMD64 image
        run: |
          docker buildx create --use
          docker buildx build --build-arg CALDERA_VERSION=${{ needs.check-version.outputs.current_version }} --platform linux/amd64 \
            -t ghcr.io/${{github.actor}}/caldera-music:amd64 \
            -t ghcr.io/${{github.actor}}/caldera-music:amd64-${{ needs.check-version.outputs.current_version }} \
            --push .

  build-arm64:
    needs: check-version
    if: needs.check-version.outputs.trigger_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GIT_HUB_TOKEN}}

      - name: Build ARM64 image
        run: |
          docker buildx create --use
          docker buildx build --build-arg CALDERA_VERSION=${{ needs.check-version.outputs.current_version }} --platform linux/arm64 \
            -t ghcr.io/${{github.actor}}/caldera-music:arm64v8 \
            -t ghcr.io/${{github.actor}}/caldera-music:arm64v8-${{ needs.check-version.outputs.current_version }} \
            --push .

  build-arm32:
    needs: check-version
    if: needs.check-version.outputs.trigger_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GIT_HUB_TOKEN}}

      - name: Build ARM32v7 image
        run: |
          docker buildx create --use
          docker buildx build --build-arg CALDERA_VERSION=${{ needs.check-version.outputs.current_version }} --platform linux/arm/v7 \
            -t ghcr.io/${{github.actor}}/caldera-music:arm32v7 \
            -t ghcr.io/${{github.actor}}/caldera-music:arm32v7-${{ needs.check-version.outputs.current_version }} \
            --push .

  create-manifests:
    needs: [check-version, build-amd64, build-arm64, build-arm32]
    if: needs.check-version.outputs.trigger_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GIT_HUB_TOKEN}}

      - name: Create multi-arch manifests
        run: |
          docker buildx imagetools create -t ghcr.io/${{github.actor}}/caldera-music:latest \
            ghcr.io/${{github.actor}}/caldera-music:amd64 \
            ghcr.io/${{github.actor}}/caldera-music:arm64v8 \
            ghcr.io/${{github.actor}}/caldera-music:arm32v7
          docker buildx imagetools create -t ghcr.io/${{github.actor}}/caldera-music:${{ needs.check-version.outputs.current_version }} \
            ghcr.io/${{github.actor}}/caldera-music:amd64-${{ needs.check-version.outputs.current_version }} \
            ghcr.io/${{github.actor}}/caldera-music:arm64v8-${{ needs.check-version.outputs.current_version }} \
            ghcr.io/${{github.actor}}/caldera-music:arm32v7-${{ needs.check-version.outputs.current_version }}

  create-release:
    needs: [check-version, create-manifests]
    if: needs.check-version.outputs.trigger_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Without this the action falls back to GITHUB_TOKEN; the PAT keeps
          # the release working regardless of the repo's default permissions.
          token: ${{ secrets.GIT_HUB_TOKEN }}
          tag_name: ${{ needs.check-version.outputs.current_version }}
          name: Caldera Music ${{ needs.check-version.outputs.current_version }}
          body: |
            ## Multi-architecture Docker images for Caldera Music ${{ needs.check-version.outputs.current_version }}

            ### Images available:
            - `ghcr.io/${{ github.actor }}/caldera-music:latest` (multi-arch: amd64, arm64, arm32v7)
            - `ghcr.io/${{ github.actor }}/caldera-music:${{ needs.check-version.outputs.current_version }}` (multi-arch: amd64, arm64, arm32v7)
            - `ghcr.io/${{ github.actor }}/caldera-music:amd64-${{ needs.check-version.outputs.current_version }}`
            - `ghcr.io/${{ github.actor }}/caldera-music:arm64v8-${{ needs.check-version.outputs.current_version }}`
            - `ghcr.io/${{ github.actor }}/caldera-music:arm32v7-${{ needs.check-version.outputs.current_version }}`

            ### Base Image:
            - Debian Trixie on every architecture (the native binary bundles its own FFmpeg)

            For usage instructions, see the [README](https://github.com/${{ github.repository }}/blob/main/README.md).
          draft: false
          prerelease: false

  update-version:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.trigger_workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Persist the PAT as the push credential, so the version bump
          # does not depend on GITHUB_TOKEN having contents: write.
          token: ${{ secrets.GIT_HUB_TOKEN }}

      - name: Update local version
        run: |
          CURRENT_VERSION_JSON=`curl -s https://releases.caldera.homes/music/headless/latest/latest.json`
          echo $CURRENT_VERSION_JSON > version.json
          git config --global user.name "Version updater"
          git config --global user.email "edd933a9@duck.com"
          # [skip ci] is load-bearing. GITHUB_TOKEN pushes cannot trigger further
          # workflow runs, but this pushes with a PAT, and PAT pushes can. Without
          # the marker this commit fires build_on_push, which rebuilds and
          # re-pushes the tags create-manifests just published. Do not remove it
          # unless this job goes back to GITHUB_TOKEN.
          git commit -am "upd: version bump to ${{ needs.check-version.outputs.current_version }} [skip ci]"
          git push